version: '3.8'

services:
  linuxsecure:
    build: .
    container_name: linuxsecure-service
    ports:
      - "8000:8000"
    environment:
      - LINUXSECURE_PORT=8000
      - LINUXSECURE_DB_PATH=backend/data/linuxsecure.db
    volumes:
      - linuxsecure-data:/app/backend/data
    restart: unless-stopped

volumes:
  linuxsecure-data:
